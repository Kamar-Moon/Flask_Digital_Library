{% extends "base.html" %}

{% block title %}
    All Books
{% endblock %}

{% block content %}
    <div class="container mt-5">
        <h2>All Books</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Status</th>
                    <th>Format</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                    <tr>
                        <td>{{ book.Title }}</td>
                        <td>{{ book.Author }}</td>
                        <td>{{ book.Status }}</td>
                        <td>{{ book.Format }}</td>
                        <td>
                            <a href="{{ url_for('edit_book', book_id=book.BookID) }}" class="btn btn-sm btn-primary">Edit</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
